name: Ondara release

# Every push to main builds a signed APK and publishes it as a GitHub release.
# Installed copies of Ondara check these releases and offer the update.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ondara-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Version
        id: version
        run: |
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: ondara-android-release
          persist-configuration-cache: 'false'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Prepare signing
        id: signing
        uses: ./.github/actions/prepare-android-signing
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Require signing
        if: steps.signing.outputs.signing_available != 'true'
        run: |
          echo "Signing secrets are missing; updates would not install over the existing app" >&2
          exit 1

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache \
            -x :androidApp:lintVitalRelease \
            -PappVersion=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          python3 scripts/collect_android_apks.py androidApp/build/outputs/apk/release dist "${{ steps.version.outputs.name }}" release
          mv dist/Metrolist.apk dist/Ondara.apk
          apksigners=("$ANDROID_HOME"/build-tools/*/apksigner)
          "${apksigners[-1]}" verify --print-certs dist/Ondara.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "${COMMIT_MESSAGE:-Manual build}" > notes.md
          gh release create "v$VERSION" dist/Ondara.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ondara $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

  windows:
    name: Windows app
    needs: android
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.android.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: ondara-desktop-windows
          persist-configuration-cache: 'false'

      - name: Generate installer icons
        uses: ./.github/actions/generate-icons

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: metro-wv2-helper/global.json

      - name: Build Windows login helper
        shell: pwsh
        working-directory: metro-wv2-helper
        run: |
          $output = "../desktopApp/src/desktopMain/resources/windows"
          dotnet publish "metro-wv2-helper.csproj" --configuration Release --runtime win-x64 --self-contained true --output $output -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { throw "Windows login helper build failed" }

      - name: Build Windows portable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          ./gradlew :desktopApp:assembleWindowsRelease             -Pmetrolist.debug=false             -Pmetrolist.verifyPackaging=false             -Pmetrolist.desktop.arch=x86_64             -PappVersion="$VERSION"             --no-daemon --no-configuration-cache
          test -f dist/Ondara-Desktop-Windows.zip

      - name: Add JVM AOT cache
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/ondara-aot-cache.ps1 -Zip dist/Ondara-Desktop-Windows.zip

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/Ondara-Desktop-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
